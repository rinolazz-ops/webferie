<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySpriss - Automatizzazione Ferie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            font-weight: 600;
            color: #334155;
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="date"], input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #f8fafc;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn-now {
            background-color: #0284c7;
            color: white;
        }
        .btn-schedule {
            background-color: #16a34a;
            color: white;
        }
        #result-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            word-break: break-all;
        }
        .success { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        
        #timer-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            text-align: center;
        }
        #countdown {
            font-size: 24px;
            font-weight: bold;
            color: #1d4ed8;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>MySpriss - Automatizzazione Ferie</h2>
    
    <div class="form-group">
        <label for="data_ferie">Data Ferie Desiderata:</label>
        <input type="date" id="data_ferie" required>
    </div>

    <div class="form-group">
        <label for="ora_invio">Ora Invio Automatico (es. 22:00:00):</label>
        <input type="time" id="ora_invio" value="22:00" step="1">
    </div>

    <div class="btn-group">
        <button type="button" class="btn-now" onclick="eseguiInvio()">🚀 Invia Adesso (Test Immediato)</button>
        <button type="button" class="btn-schedule" onclick="avviaProgrammazione()">⏰ Programma Invio Automatico</button>
    </div>

    <!-- BOX ESITO -->
    <div id="result-box"></div>

    <!-- BOX TIMER -->
    <div id="timer-box">
        <div style="font-size:13px; color:#1e40af;">In attesa dell'ora di invio...</div>
        <div id="countdown">00:00:00</div>
        <div style="font-size:11px; color:#64748b; margin-top:4px;">Mantieni questa schermata aperta</div>
    </div>
</div>

<script>
    // Token JWT (Valido fino a Settembre 2026)
    const JWT_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJGdWxsVXNlck5hbWUiOiJMQVpaQU5PIFNFVkVSSU5PIiwiRW1haWwiOiJyaW5vbGF6ekBnbWFpbC5jb20iLCJSZWdpc3RyYXRpb25OdW1iZXIiOiIxODgxIiwiRmlzY2FsQ29kZSI6IkxaWlNSTjg1TTE4RzI3M1ciLCJWaXNpYmlsaXR5Ijoie1wiSWRDb21wYW55XCI6XCIxMFwiLFwiSWREZXBhcnRtZW50XCI6XCIyXCIsXCJJZFNlY3RvclwiOlwiM1wiLFwiSWRPcmdhbml6YXRpb25hbFVuaXRcIjpcIkFWX0VYVERPTFwiLFwiSWRSZXNpZGVuY2VcIjpcIjgyNzAxXCJ9IiwibmJmIjoxNzg4MTEyMTQ5LCJleHAiOjE3ODg3MTIxNDksImlhdCI6MTc4ODExMjE0OX0.tW9v0u-O5xtkkAfmDCWjy77BAYidxmgoY-zUqCG4GhE";

    // Imposta automaticamente come predefinita la data tra 30 giorni
    const oggi = new Date();
    const data30Giorni = new Date();
    data30Giorni.setDate(oggi.getDate() + 30);
    document.getElementById('data_ferie').value = data30Giorni.toISOString().split('T')[0];

    let timerInterval = null;

    async function eseguiInvio() {
        const dataInput = document.getElementById('data_ferie').value;
        const resultBox = document.getElementById('result-box');
        
        if (!dataInput) {
            alert("Seleziona una data per le ferie!");
            return;
        }

        resultBox.style.display = 'block';
        resultBox.className = '';
        resultBox.style.backgroundColor = '#f1f5f9';
        resultBox.style.color = '#334155';
        resultBox.innerHTML = "⏳ Invio richiesta a MySpriss in corso...";

        // Calcolo della data in UTC (Mezzanotte Italia -> 22:00 UTC giorno prima)
        const dateObj = new Date(dataInput + 'T00:00:00');
        const dataISO = dateObj.toISOString();

        const payload = {
            "IdCausal": 2,
            "PunctualDate": dataISO,
            "NewPunctualDate": dataISO,
            "RangeDateFrom": null,
            "RangeDateTo": null,
            "NewRangeDateFrom": null,
            "NewRangeDateTo": null,
            "ChoiceSelected": []
        };

        try {
            const response = await fetch('https://frontendmyspriss.avmspa.it/api/RequestApi/SaveRequest', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json, text/plain, */*',
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + JWT_TOKEN
                },
                body: JSON.stringify(payload)
            });

            const data = await response.text();

            if (response.ok) {
                resultBox.className = 'success';
                resultBox.innerHTML = `✅ <strong>Richiesta Inviata con Successo!</strong><br>Data: ${dataInput}<br><small>Risposta: ${data}</small>`;
            } else {
                resultBox.className = 'error';
                resultBox.innerHTML = `❌ <strong>Errore ${response.status}</strong><br>${data}`;
            }
        } catch (error) {
            resultBox.className = 'error';
            resultBox.innerHTML = `❌ <strong>Errore di Connessione:</strong><br>${error.message}`;
        }
    }

    function avviaProgrammazione() {
        const oraInvio = document.getElementById('ora_invio').value;
        if (!oraInvio) {
            alert("Inserisci l'ora di invio!");
            return;
        }

        const [ore, minuti, secondi] = oraInvio.split(':').map(Number);
        
        let targetDate = new Date();
        targetDate.setHours(ore, minuti, secondi || 0, 0);

        if (targetDate <= new Date()) {
            targetDate.setDate(targetDate.getDate() + 1);
        }

        document.getElementById('timer-box').style.display = 'block';
        document.getElementById('result-box').style.display = 'none';

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            const adesso = new Date();
            const differenza = targetDate - adesso;

            if (differenza <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer-box').style.display = 'none';
                eseguiInvio();
            } else {
                const h = String(Math.floor(differenza / (1000 * 60 * 60))).padStart(2, '0');
                const m = String(Math.floor((differenza % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                const s = String(Math.floor((differenza % (1000 * 60)) / 1000)).padStart(2, '0');
                document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
            }
        }, 200);
    }
</script>

</body>
</html>
