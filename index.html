<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySpriss - Test Manuale Ferie</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #f1f5f9;
  margin: 0;
  padding: 16px;
  display: flex;
  justify-content: center;
}
.card {
  background: #ffffff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  width: 100%;
  max-width: 440px;
}
h2 {
  margin-top: 0;
  color: #0f172a;
  font-size: 20px;
  text-align: center;
}
.notice {
  background-color: #fffbeb;
  border: 1px solid #fde68a;
  color: #92400e;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 20px;
}
.form-group {
  margin-bottom: 16px;
}
label {
  font-weight: 600;
  color: #334155;
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
}
input[type="date"], input[type="password"] {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
  background-color: #f8fafc;
}
button {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  background-color: #0284c7;
  color: white;
  margin-top: 8px;
}
</style>
</head>
<body>
<div class="card">
  <h2>MySpriss - Test Manuale Ferie</h2>

  <div class="notice">
    Questo è solo uno strumento di test manuale. L'invio automatico giornaliero
    (30 giorni prima, alle 22:00) lo fa la GitHub Action <code>Richiesta Ferie Automatica</code>.
    Il token qui sotto NON viene salvato da nessuna parte: lo incolli e lo usi al momento.
  </div>

  <form action="invia.php" method="POST">
    <div class="form-group">
      <label for="data_ferie">Data Ferie Desiderata:</label>
      <input type="date" id="data_ferie" name="data_ferie" required>
    </div>

    <div class="form-group">
      <label for="jwt_token">Token JWT (incollalo da DevTools dopo il login):</label>
      <input type="password" id="jwt_token" name="jwt_token" required autocomplete="off">
    </div>

    <button type="submit">🚀 Invia Richiesta (Test Manuale)</button>
  </form>
</div>
</body>
</html>
