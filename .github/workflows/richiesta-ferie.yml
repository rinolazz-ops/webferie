name: Richiesta Ferie Automatica

on:
  schedule:
    - cron: '30 19 * * *'   # 21:30 ora legale italiana (CEST, UTC+2) — 30 min di anticipo
    - cron: '30 20 * * *'   # 21:30 ora solare italiana (CET, UTC+1) — 30 min di anticipo
  workflow_dispatch:
    inputs:
      forza:
        description: 'Salta il controllo orario (solo per test manuali)'
        type: boolean
        default: false

jobs:
  invia-richiesta:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # fallisce in modo pulito se qualcosa si blocca, invece di aspettare le 6 ore di default
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Invia richiesta ferie
        env:
          MYSPRISS_JWT: ${{ secrets.MYSPRISS_JWT }}
          FORZA: ${{ github.event.inputs.forza }}
        run: bash invia_ferie.sh
