name: Richiesta Ferie Automatica

on:
  schedule:
    - cron: '0 20 * * *'   # 22:00 ora legale italiana (CEST, UTC+2)
    - cron: '0 21 * * *'   # 22:00 ora solare italiana (CET, UTC+1)
  workflow_dispatch:
    inputs:
      forza:
        description: 'Salta il controllo orario (solo per test manuali)'
        type: boolean
        default: false

jobs:
  invia-richiesta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Invia richiesta ferie
        env:
          MYSPRISS_JWT: ${{ secrets.MYSPRISS_JWT }}
          FORZA: ${{ github.event.inputs.forza }}
        run: bash invia_ferie.sh
